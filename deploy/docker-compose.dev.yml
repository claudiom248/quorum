# Local development environment. Credentials are for development ONLY, never production.
# Start: docker compose -f deploy/docker-compose.dev.yml up -d
name: quorum-dev

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: quorum
      POSTGRES_PASSWORD: quorum-dev
      POSTGRES_DB: quorum
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quorum -d quorum"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Default RAG vector store. Dashboard: http://localhost:6333/dashboard
  # (the pgvector image above also lets you try the pgvector option on a separate database)
  qdrant:
    image: qdrant/qdrant:v1.12.0
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage

  # Local OIDC identity provider to try company sign-in.
  # Admin console: http://localhost:8081  (admin / admin-dev)
  # Example realm issuer: http://localhost:8081/realms/<realm>
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin-dev
      KC_HTTP_PORT: 8080
    ports:
      - "8081:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data

volumes:
  postgres-data:
  keycloak-data:
  qdrant-data:
