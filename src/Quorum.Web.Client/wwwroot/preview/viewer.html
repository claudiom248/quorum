<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Quorum preview viewer</title>
    <!--
      This page runs inside <iframe sandbox="allow-scripts"> (spec 014, D-6): opaque origin, no access to the app's
      storage, cookies or DOM, no permissions. Its Content-Security-Policy is served as a response header on
      /preview/** (D-7) because a static meta policy cannot work here: the frame's origin is opaque, so 'self' would
      match nothing and even block the vendored libraries the header allows. There is no connect-src in the policy,
      so this page cannot reach the network, and frame-src about: covers only the nested srcdoc frame below.
    -->
    <link rel="stylesheet" href="lib/json-formatter-js/json-formatter.css">
    <style>
        :root {
            --pv-background: #ffffff;
            --pv-surface: #ffffff;
            --pv-text: #1a1a1a;
            --pv-text-secondary: #5c5c5c;
            --pv-lines: #dcdcdc;
            --pv-primary: #594ae2;
        }

        html, body {
            margin: 0;
            padding: 0;
            background: var(--pv-background);
            color: var(--pv-text);
            font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
        }

        body { padding: .5rem; }

        .pv-notice { color: var(--pv-text-secondary); padding: .5rem; }

        /* The HTML block renders in a nested sandboxed frame on a white canvas, whatever the theme (D-9, D-21). */
        .pv-html { border: 0; width: 100%; height: calc(100vh - 1rem); background: #fff; display: block; }

        .pv-svg { max-width: 100%; background: #fff; }

        .pv-csv-scroll { overflow: auto; max-height: calc(100vh - 1rem); }

        table.pv-csv { border-collapse: collapse; font-size: 13px; }

        table.pv-csv th, table.pv-csv td {
            border: 1px solid var(--pv-lines);
            padding: 2px 8px;
            text-align: left;
            white-space: pre;
        }

        table.pv-csv th { position: sticky; top: 0; background: var(--pv-surface); }

        /* json-formatter-js ships a light stylesheet only: these are the dark-theme overrides (D-14). */
        body[data-theme="dark"] .json-formatter-row,
        body[data-theme="dark"] .json-formatter-key { color: var(--pv-text); }
        body[data-theme="dark"] .json-formatter-string { color: #9ccc65; }
        body[data-theme="dark"] .json-formatter-number { color: #64b5f6; }
        body[data-theme="dark"] .json-formatter-boolean { color: #ffb74d; }
        body[data-theme="dark"] .json-formatter-null,
        body[data-theme="dark"] .json-formatter-undefined { color: #e57373; }
        body[data-theme="dark"] .json-formatter-bracket { color: var(--pv-text-secondary); }
        body[data-theme="dark"] .json-formatter-toggler { color: var(--pv-text-secondary); }

        .pv-mermaid { display: flex; justify-content: center; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script src="viewer.js"></script>
</body>
</html>
