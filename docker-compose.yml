# Quorum: the app and (optionally) a bundled PostgreSQL.
#
#   cp .env.example .env        # then set POSTGRES_PASSWORD
#   docker compose --profile bundled-db up --build
#
# To stamp the real version on the image (shown by /api/version), run docker compose through deploy/compose.sh:
#   sh deploy/compose.sh --profile bundled-db up --build -d
#
# Profiles combine: --profile bundled-db (PostgreSQL), --profile qdrant and --profile pgvector (vector stores for knowledge bases),
# --profile searxng (the instance a web search tool asks).
#
# The image is built from the sources inside Docker (no step to run beforehand).
#
# Open http://localhost:8080 and paste the setup token printed in the logs
# (docker compose logs quorum). To use your own PostgreSQL, set QUORUM_DATABASE in .env
# and start without the profile: docker compose up --build
name: quorum

services:
  quorum:
    build:
      context: .
      # The version stamped on the image (/api/version): the build has no git history, so deploy/compose.sh passes it.
      args:
        VERSION: ${QUORUM_VERSION:-0.0.0-local}
    image: quorum:local
    restart: unless-stopped
    ports:
      # Loopback by default: set QUORUM_BIND=0.0.0.0 (ideally behind a TLS reverse proxy) to serve other machines.
      - "${QUORUM_BIND:-127.0.0.1}:${QUORUM_PORT:-8080}:8080"
    environment:
      ConnectionStrings__Platform: ${QUORUM_DATABASE:-Host=postgres;Port=5432;Database=quorum;Username=quorum;Password=${POSTGRES_PASSWORD:-}}
      DataProtection__KeysPath: /var/lib/quorum/keys
    # Lets the container reach a model server on the host at host.docker.internal; Docker Desktop already does, Linux needs this.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - quorum-keys:/var/lib/quorum/keys
    depends_on:
      postgres:
        condition: service_healthy
        required: false

  postgres:
    profiles: [bundled-db]
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: quorum
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: quorum
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quorum -d quorum"]
      interval: 5s
      timeout: 3s
      retries: 10

  # A vector store to register knowledge bases from (profile "qdrant"). Quorum only reads it: whoever owns the documents fills it.
  # Inside the compose network register it as http://qdrant:6334 (gRPC). The ports below are for the dashboard and for ingestion
  # from the host; Qdrant has no API key here, so they stay on loopback.
  qdrant:
    profiles: [qdrant]
    image: qdrant/qdrant:v1.12.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage

  # A PostgreSQL with the pgvector extension to register knowledge bases from (profile "pgvector"). It is separate from the
  # platform's database, which is never used for knowledge bases. Quorum only reads it: whoever owns the documents fills it.
  # Inside the compose network register it as host pgvector, port 5432, database "knowledge". The published port is for ingestion
  # and clients on the host and stays on loopback. The user is "knowledge"; set PGVECTOR_PASSWORD in .env (without it the
  # container refuses to start; it is not "required" in the file because that would break every start without this profile).
  # Enable the extension once, in the database you fill: CREATE EXTENSION IF NOT EXISTS vector;
  pgvector:
    profiles: [pgvector]
    image: pgvector/pgvector:0.8.1-pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: knowledge
      POSTGRES_PASSWORD: ${PGVECTOR_PASSWORD:-}
      POSTGRES_DB: knowledge
    ports:
      - "127.0.0.1:${PGVECTOR_PORT:-5433}:5432"
    volumes:
      - pgvector-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowledge -d knowledge"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The SearXNG instance the platform searches with (profile "searxng", spec 005). Register it in Settings > Web search as
  # http://searxng:8080 from inside this network, or http://127.0.0.1:8888 when Quorum runs on the host. The settings file enables
  # the json answer format, without which a search of the web cannot work; the secret comes from .env and is not in the file.
  # The published port is for checking the instance from a browser and stays on loopback.
  searxng:
    profiles: [searxng]
    image: searxng/searxng:2026.10.13-22c64b8d3
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?Set SEARXNG_SECRET in .env}
      SEARXNG_BASE_URL: http://searxng:8080/
    ports:
      - "127.0.0.1:${SEARXNG_PORT:-8888}:8080"
    volumes:
      - ./deploy/searxng/settings.yml:/etc/searxng/settings.yml:ro

volumes:
  quorum-keys:
  postgres-data:
  qdrant-data:
  pgvector-data:
